# Reverse proxy: TLS termination in front of the pharmacy API.
# Mounted read-only into the nginx container by docker-compose.yml.

upstream pharmacy_app {
    server app:8000; # docker-compose service name (internal network)
}

# Plain HTTP exists only to redirect to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pharmacy.local localhost;

    # Self-signed cert for local/VM deployment (generate with: make certs)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Don't leak version banners
    server_tokens off;

    location / {
        proxy_pass http://pharmacy_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Fail fast if the app is wedged; surface 502/504 for diagnosis
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
