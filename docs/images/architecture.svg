<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Architecture: CI pipeline publishes an immutable image; docker compose runs nginx, the API and PostgreSQL">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 z" fill="#4b6a95"/>
    </marker>
    <marker id="arrowDashed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 z" fill="#5d7fa8"/>
    </marker>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0c1626"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .label { font-size: 11px; letter-spacing: 2px; font-weight: 600; fill: #6ea8d8; }
      .box { fill: #14223a; stroke: #2b4368; stroke-width: 1.4; }
      .box-title { font-size: 13.5px; font-weight: 600; fill: #e8f0fb; }
      .box-line { font-size: 11.5px; fill: #93a4c0; }
      .note { font-size: 12px; fill: #7f93b3; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#page)"/>
  <rect width="1200" height="620" rx="18" fill="none" stroke="#22344f" stroke-width="1.5"/>

  <!-- ================= CI ================= -->
  <rect x="40" y="100" width="1120" height="146" rx="14" fill="#0e1a2c" stroke="#2b4368" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text class="t label" x="64" y="130">GITHUB ACTIONS · ON EVERY PUSH / PR</text>

  <!-- 1 quality -->
  <rect class="box" x="54" y="142" width="196" height="80" rx="10"/>
  <g transform="translate(74,162)" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-4,0 L-1,3 L4,-4"/>
  </g>
  <text class="t box-title" x="90" y="167">Quality</text>
  <text class="t box-line" x="70" y="189">ruff format + lint</text>
  <text class="t box-line" x="70" y="206">pytest vs real Postgres</text>

  <line x1="254" y1="182" x2="270" y2="182" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2 build -->
  <rect class="box" x="278" y="142" width="196" height="80" rx="10"/>
  <g transform="translate(298,162)" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linejoin="round">
    <path d="M-4,-4 L0,-6 L4,-4 L4,2 L0,4 L-4,2 Z"/>
    <path d="M-4,-4 L0,-2 L4,-4 M0,-2 L0,4"/>
  </g>
  <text class="t box-title" x="314" y="167">Build</text>
  <text class="t box-line" x="294" y="189">multi-stage image</text>
  <text class="t box-line" x="294" y="206">non-root, slim runtime</text>

  <line x1="478" y1="182" x2="494" y2="182" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3 trivy -->
  <rect class="box" x="502" y="142" width="196" height="80" rx="10"/>
  <g transform="translate(522,162)" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linejoin="round">
    <path d="M0,-6 L5,-4 L5,1 C5,4 2,5.5 0,6 C-2,5.5 -5,4 -5,1 L-5,-4 Z"/>
  </g>
  <text class="t box-title" x="538" y="167">Trivy gate</text>
  <text class="t box-line" x="518" y="189">fail on fixable</text>
  <text class="t box-line" x="518" y="206">HIGH / CRITICAL</text>

  <line x1="702" y1="182" x2="718" y2="182" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4 publish -->
  <rect class="box" x="726" y="142" width="196" height="80" rx="10"/>
  <g transform="translate(746,162)" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,5 L0,-5 M-3.5,-1.5 L0,-5 L3.5,-1.5"/>
    <path d="M-5,3 L-5,6 L5,6 L5,3"/>
  </g>
  <text class="t box-title" x="762" y="167">Publish</text>
  <text class="t box-line" x="742" y="189">GHCR :sha-&lt;commit&gt;</text>
  <text class="t box-line" x="742" y="206">immutable artifact</text>

  <line x1="926" y1="182" x2="942" y2="182" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5 smoke -->
  <rect class="box" x="950" y="142" width="196" height="80" rx="10"/>
  <g transform="translate(970,162)" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-5,0 L-1.5,0 L0.5,-4 L2.5,4 L4,0 L5,0"/>
  </g>
  <text class="t box-title" x="986" y="167">Smoke test</text>
  <text class="t box-line" x="966" y="189">boot the pushed image</text>
  <text class="t box-line" x="966" y="206">/health /ready /medicines</text>

  <!-- CI -> host -->
  <line x1="1048" y1="246" x2="1048" y2="292" stroke="#5d7fa8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <text class="t note" x="1036" y="274" text-anchor="end">deploy by immutable tag</text>

  <!-- ================= HOST ================= -->
  <rect x="40" y="300" width="1120" height="272" rx="14" fill="#0e1a2c" stroke="#2b4368" stroke-width="1.3"/>
  <text class="t label" x="64" y="330">DEPLOYMENT HOST · DOCKER COMPOSE</text>

  <!-- client -->
  <rect x="64" y="376" width="110" height="64" rx="10" fill="#101d31" stroke="#2b4368" stroke-width="1.3"/>
  <g transform="translate(119,400)" fill="none" stroke="#93a4c0" stroke-width="1.5" stroke-linecap="round">
    <circle cx="0" cy="-2" r="3.2"/>
    <path d="M-5,6 C-5,2.5 -2.5,1 0,1 C2.5,1 5,2.5 5,6"/>
  </g>
  <text class="t box-line" x="119" y="428" text-anchor="middle">Client</text>

  <line x1="178" y1="408" x2="232" y2="408" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t note" x="205" y="398" text-anchor="middle">HTTPS</text>

  <!-- nginx -->
  <rect class="box" x="240" y="356" width="170" height="104" rx="10"/>
  <g transform="translate(262,378)" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-linecap="round">
    <rect x="-5" y="-2" width="10" height="8" rx="2"/>
    <path d="M-3,-2 L-3,-4.5 C-3,-6.5 3,-6.5 3,-4.5 L3,-2"/>
  </g>
  <text class="t box-title" x="278" y="382">nginx</text>
  <text class="t box-line" x="256" y="404">TLS termination</text>
  <text class="t box-line" x="256" y="421">443 · 80 → 443</text>
  <text class="t box-line" x="256" y="438">only published port</text>

  <line x1="414" y1="408" x2="468" y2="408" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t note" x="441" y="398" text-anchor="middle">HTTP</text>

  <!-- app -->
  <rect class="box" x="476" y="356" width="190" height="104" rx="10"/>
  <g transform="translate(498,378)" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round">
    <path d="M-5,-4 L0,-7 L5,-4 L5,4 L0,7 L-5,4 Z"/>
    <path d="M0,-1 L0,2 M-1.5,0.5 L1.5,0.5"/>
  </g>
  <text class="t box-title" x="514" y="382">pharmacy-api</text>
  <text class="t box-line" x="492" y="404">non-root user</text>
  <text class="t box-line" x="492" y="421">:8000 · internal only</text>
  <text class="t box-line" x="492" y="438">health-gated start</text>

  <line x1="670" y1="408" x2="724" y2="408" stroke="#4b6a95" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t note" x="697" y="398" text-anchor="middle">SQL</text>

  <!-- postgres -->
  <rect class="box" x="732" y="356" width="180" height="104" rx="10"/>
  <g transform="translate(754,378)" fill="none" stroke="#38bdf8" stroke-width="1.6">
    <ellipse cx="0" cy="-4" rx="5" ry="2"/>
    <path d="M-5,-4 L-5,4 C-5,5.5 5,5.5 5,4 L5,-4"/>
    <path d="M-5,0 C-5,1.5 5,1.5 5,0"/>
  </g>
  <text class="t box-title" x="770" y="382">PostgreSQL 16</text>
  <text class="t box-line" x="748" y="404">pgdata volume</text>
  <text class="t box-line" x="748" y="421">private network</text>
  <text class="t box-line" x="748" y="438">CHECK qty &gt;= 0</text>

  <line x1="916" y1="408" x2="940" y2="408" stroke="#5d7fa8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>

  <!-- backups -->
  <rect x="948" y="356" width="152" height="104" rx="10" fill="#101d31" stroke="#2b4368" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g transform="translate(968,378)" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-5,-4 L0,-7 L5,-4 L5,4 L0,7 L-5,4 Z"/>
    <path d="M-5,-4 L0,-1 L5,-4 M0,-1 L0,7"/>
  </g>
  <text class="t box-title" x="984" y="382">backups/</text>
  <text class="t box-line" x="964" y="404">pg_dump -Fc</text>
  <text class="t box-line" x="964" y="421">keep newest 7</text>
  <text class="t box-line" x="964" y="438">restore tested</text>

  <!-- guarantees -->
  <g class="t box-line">
    <rect x="64" y="496" width="196" height="34" rx="17" fill="#101d31" stroke="#2b4368"/>
    <text x="162" y="518" text-anchor="middle">restart: unless-stopped</text>

    <rect x="274" y="496" width="130" height="34" rx="17" fill="#101d31" stroke="#2b4368"/>
    <text x="339" y="518" text-anchor="middle">pool_pre_ping</text>

    <rect x="418" y="496" width="230" height="34" rx="17" fill="#101d31" stroke="#2b4368"/>
    <text x="533" y="518" text-anchor="middle">start order db → app → nginx</text>

    <rect x="662" y="496" width="168" height="34" rx="17" fill="#101d31" stroke="#2b4368"/>
    <text x="746" y="518" text-anchor="middle">DB never published</text>

    <rect x="844" y="496" width="190" height="34" rx="17" fill="#101d31" stroke="#2b4368"/>
    <text x="939" y="518" text-anchor="middle">JSON logs + request ID</text>
  </g>
</svg>
