[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-api"
version = "1.0.0"
description = "Medicine, batch and stock-movement API for the Pharmacy Management Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # modernize py syntax
    "B",   # common bug risks
    "SIM", # simplify
]
ignore = [
    "B008", # FastAPI dependency injection uses calls in argument defaults by design
]

[tool.pytest.ini_options]
testpaths = ["tests"]
