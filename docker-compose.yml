# Pharmacy Management Platform — local/VM deployment stack.
#
#   nginx (TLS :443) -> app (:8000, internal) -> postgres (:5432, internal)
#
# Only nginx publishes public ports. The app's :8000 is bound to 127.0.0.1
# for local debugging only. Database credentials come from .env (see
# .env.example); the :? below makes the stack refuse to start with an
# unset password instead of silently falling back to a default secret.

name: pharmacy-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
    volumes:
      - pgdata:/var/lib/postgresql/data # survives container recreation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  app:
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    image: ${IMAGE_NAME:-pharmacy-api}:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}
      APP_VERSION: ${IMAGE_TAG:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy # don't boot the app before the DB is ready
    healthcheck:
      # Readiness (not just liveness): the container is only "healthy"
      # when it can actually serve traffic, i.e. the DB answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped # self-healing: container-level recovery
    networks: [backend]
    ports:
      - "127.0.0.1:8000:8000" # debug port, localhost only

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro # generate via: make certs
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      app:
        condition: service_healthy # never route traffic to a cold app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [backend]

networks:
  backend: {}

volumes:
  pgdata: {}
